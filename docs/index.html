<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウマ娘 LoH スコア計算</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ウマ娘 リーグオブヒーローズ スコア計算</h1>

    <div class="player-section">
        <h2>プレイヤー1</h2>
        <label for="player1Name">プレイヤー名:</label>
        <input type="text" id="player1Name" value="プレイヤーA"><br><br>
        <div class="uma-ranks-container">
            <div class="uma-rank-group">
                <label>ウマ娘1:</label>
            </div>
            <div class="uma-rank-group">
                <label>ウマ娘2:</label>
            </div>
            <div class="uma-rank-group">
                <label>ウマ娘3:</label>
            </div>
        </div>
        <p>スコア: <span id="player1Score">0</span>点</p>
    </div>

    <div class="player-section">
        <h2>プレイヤー2</h2>
        <label for="player2Name">プレイヤー名:</label>
        <input type="text" id="player2Name" value="プレイヤーB"><br><br>
        <div class="uma-ranks-container">
            <div class="uma-rank-group">
                <label>ウマ娘1:</label>
            </div>
            <div class="uma-rank-group">
                <label>ウマ娘2:</label>
            </div>
            <div class="uma-rank-group">
                <label>ウマ娘3:</label>
            </div>
        </div>
        <p>スコア: <span id="player2Score">0</span>点</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
