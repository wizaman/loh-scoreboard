<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウマ娘 LoH スコア計算</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ウマ娘 リーグオブヒーローズ スコア計算</h1>

    <div class="trainer-section">
        <div class="trainer-header">
            <h2>トレーナー1</h2>
            <input type="text" id="trainer1Name" value="トレーナーA">
            <p>スコア: <span id="trainer1Score">0</span>点</p>
        </div>
        <div class="uma-ranks-container">
            <div class="uma-rank-group">
                <label>ウマ娘1:</label>
                <input type="text" class="uma-name" id="trainer1Uma1Name" placeholder="ウマ娘名">
            </div>
            <div class="uma-rank-group">
                <label>ウマ娘2:</label>
                <input type="text" class="uma-name" id="trainer1Uma2Name" placeholder="ウマ娘名">
            </div>
            <div class="uma-rank-group">
                <label>ウマ娘3:</label>
                <input type="text" class="uma-name" id="trainer1Uma3Name" placeholder="ウマ娘名">
            </div>
        </div>
    </div>

    <div class="trainer-section">
        <div class="trainer-header">
            <h2>トレーナー2</h2>
            <input type="text" id="trainer2Name" value="トレーナーB">
            <p>スコア: <span id="trainer2Score">0</span>点</p>
        </div>
        <div class="uma-ranks-container">
            <div class="uma-rank-group">
                <label>ウマ娘1:</label>
                <input type="text" class="uma-name" id="trainer2Uma1Name" placeholder="ウマ娘名">
            </div>
            <div class="uma-rank-group">
                <label>ウマ娘2:</label>
                <input type="text" class="uma-name" id="trainer2Uma2Name" placeholder="ウマ娘名">
            </div>
            <div class="uma-rank-group">
                <label>ウマ娘3:</label>
                <input type="text" class="uma-name" id="trainer2Uma3Name" placeholder="ウマ娘名">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
