<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウマ娘 LoH スコア計算</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="header-container">
        <h1>ウマ娘 LoH スコア計算</h1>
        <div class="header-buttons">
            <button id="add-race-btn">+ レース追加</button>
            <button id="copy-json-btn">JSONコピー</button>
            <button id="paste-json-btn">JSONペースト</button>
            <button id="reset-btn">リセット</button>
        </div>
    </div>

    <div class="total-scores">
        <h2>総合スコア</h2>
        <div id="total-score-details-container"></div>
    </div>

    <div id="races-container"></div>

    <div id="json-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>JSONデータをペースト</h2>
            <textarea id="json-input-textarea" placeholder="ここにJSONデータをペーストしてください" rows="15"></textarea>
            <div class="modal-buttons">
                <button id="modal-paste-btn">反映</button>
                <button id="modal-cancel-btn">キャンセル</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
